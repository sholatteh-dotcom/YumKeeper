name: EAS Build

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build on EAS
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios
      profile:
        description: EAS build profile
        required: true
        default: production
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: eas-build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform || 'all' }}-${{ inputs.profile || 'production' }}
  cancel-in-progress: false

env:
  CI: true
  EAS_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'production' }}

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm check

      - name: Run tests with coverage thresholds
        run: pnpm test:coverage

      - name: Reject skipped tests
        run: |
          if rg -n "(?:describe|it|test)\\.skip" tests; then
            echo "Skipped tests are not allowed in the release validation suite."
            exit 1
          fi

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Validate Expo configuration
        run: pnpm exec expo config --type public

  approval:
    name: Approve ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'production' }} build
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'preview' && 'preview' || 'production' }}
    steps:
      - name: Confirm release request
        run: echo "Validation succeeded. The protected environment gate approved this EAS build request."

  build-android:
    name: Build Android (${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'production' }})
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android') }}
    needs:
      - validate
      - approval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Request EAS build
        run: eas build --platform android --profile "$EAS_PROFILE" --non-interactive --no-wait

  build-ios:
    name: Build iOS (${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'production' }})
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios') }}
    needs:
      - validate
      - approval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Request EAS build
        run: eas build --platform ios --profile "$EAS_PROFILE" --non-interactive --no-wait
